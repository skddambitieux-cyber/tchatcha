<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>SCR-102 Livreur : livraison terminée</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>14:17</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Livraison</h1></div>
  <div class="content">
    <div class="success-screen" style="padding:0"><div class="check-anim">✓</div>
      <h2 style="font-family:var(--font-display);font-size:22px;margin:8px 0">Colis livré à Amina D.</h2>
      <p class="small muted">Code de confirmation entré · remise en main propre</p></div>
    <div class="card"><div class="row"><span style="font-size:22px">📸</span><div class="grow"><div class="title">Preuve de livraison</div><div class="sub">Photo (2) + signature du client</div></div><span class="chip">✓ Fait</span></div></div>
    <div class="card" style="text-align:center;gap:4px">
      <div class="muted small">Gain de la course</div><div class="money lg" style="color:var(--primary-600)">2 500 F</div>
    </div>
    <div class="card" style="background:var(--primary-50)"><div class="small">💡 Dépôt en caisse le 1er et 16 de chaque mois par MTN MoMo ou Moov Money.</div></div>
    <button class="btn primary block" onclick="this.closest('.phone').innerHTML='<div class=phone style=display:flex;align-items:center;justify-content:center><div style=text-align:center><div class=check-anim>+2</div><h3 style=font-family:var(--font-display) class=muted>Bien joué !</h3><p class=small muted>Votre ponctualité améliore votre score.</p></div></div>'">Nouvelle course</button>
  </div>
</div>
</body></html>
