<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>SCR-104 Livreur : évaluation</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>14:17</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Évaluation de la course</h1></div>
  <div class="content">
    <div class="card" style="text-align:center;gap:6px"><div style="font-size:44px">📦</div>
      <div style="font-family:var(--font-display);font-weight:700;margin-top:8px">Comment s'est passée la remise ?</div>
      <div class="small muted">Votre avis reste anonyme.</div>
      <div class="stars" style="font-size:30px;margin-top:8px">★★★★★</div>
      <div class="chip-row" style="justify-content:center;margin-top:10px">
        <span class="chip">Arrivé à l'heure</span><span class="chip">Courtois</span><span class="chip">Colis en bon état</span>
      </div>
    </div>
    <button class="btn primary block">Envoyer la note</button>
  </div>
</div>
</body></html>
