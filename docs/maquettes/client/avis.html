<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>SCR-031 Avis</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Votre avis</h1></div>
  <div class="content">
    <div class="card"><div class="row"><div class="avatar">K</div><div class="grow"><strong>Kossi A.</strong><div class="sub">Pose de carrelage · terminée hier</div></div></div></div>
    <div class="card" style="text-align:center;gap:6px">
      <div class="section-title" style="text-align:center">Note générale</div>
      <div class="stars" style="font-size:32px">★★★★★</div>
    </div>
    <div class="card"><div class="row"><div class="grow small">Ponctualité</div><div class="stars">★★★★★</div></div>
      <div class="row"><div class="grow small">Qualité du travail</div><div class="stars">★★★★★</div></div>
      <div class="row"><div class="grow small">Rapport qualité/prix</div><div class="stars">★★★★☆</div></div>
      <div class="row"><div class="grow small">Politesse</div><div class="stars">★★★★★</div></div></div>
    <div class="field"><label>Commentaire</label><textarea class="input" rows="3">Travail soigné, ponctuel. Le salon est magnifique, je recommande Kossi !</textarea></div>
    <div class="field"><label>Photos (optionnel)</label><div class="row"><div class="thumb placeholder" style="border:2px dashed var(--neutral-300);background:var(--surface);font-size:22px;cursor:pointer">+</div><div class="thumb placeholder" style="background:var(--primary-100)">🛋️</div></div></div>
    <button class="btn primary block">Publier mon avis</button>
    <div class="small muted" style="text-align:center">Votre avis est publié après la prestation payée et sécurisé.</div>
  </div>
</div>
</body></html>
