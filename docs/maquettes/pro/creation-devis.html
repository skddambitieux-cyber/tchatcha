<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>SCR-080 Création d'un devis</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Votre devis</h1></div>
  <div class="content">
    <div class="card"><div class="title">Pose de carrelage 150 m²</div>
      <div class="sub">📍 Fidjrossè · Budget client 150–250k F · Photos (3)</div>
      <div class="row"><div class="thumb placeholder" style="width:56px;height:56px">🏠</div><div class="thumb placeholder" style="width:56px;height:56px">🛁</div><div class="thumb placeholder" style="width:56px;height:56px">📐</div></div></div>
    <div class="field"><label>Prix *</label><div class="row"><input class="input grow" value="200 000"><span class="muted">FCFA</span></div><span class="err">Le budget max du client est 250 000 F ✔</span></div>
    <div class="field"><label>Délai *</label><input class="input" value="6 jours"></div>
    <div class="field"><label>Message</label><textarea class="input" rows="3">Fourniture du carrelage incluse, garantie 1 an. Prix ferme.</textarea></div>
    <div class="card" style="background:var(--primary-50)"><div class="row"><span style="font-size:20px">✓</span><div class="small">Rapport accepté ~20 min par le client. Plus vous répondez vite, plus votre score monte.</div></div></div>
    <button class="btn primary block">Envoyer le devis</button>
  </div>
</div>
</body></html>
