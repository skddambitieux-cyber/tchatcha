<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>SCR-073 Création du profil</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Mon profil</h1></div>
  <div class="content">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="avatar" style="width:72px;height:72px;font-size:28px;outline:2px dashed var(--primary-500)">K</div>
      <button class="btn outline sm">📷 Télécharger</button>
    </div>
    <div class="field"><label>Nom / enseigne *</label><input class="input" value="Kossi A."></div>
    <div class="field"><label>Métier principal *</label><select class="input"><option>Artisans › Carreleur</option></select></div>
    <div class="field"><label>Années d'expérience</label><input class="input" value="15"></div>
    <div class="field"><label>Présentation *</label><textarea class="input" rows="3">Pose de carrelage à Cotonou, fourniture possible, garantie 1 an.</textarea></div>
    <div class="row"><div class="field grow"><label>Ville</label><select class="input"><option>Cotonou</option></select></div><div class="field grow"><label>Quartier</label><select class="input"><option>Fidjrossè</option></select></div></div>
    <div class="row"><div class="field grow"><label>Prix indicatif</label><input class="input" value="1 500"></div><div class="field"><label>Devise</label><select class="input"><option>FCFA</option></select></div><div class="field"><label>Unité</label><select class="input"><option>par m²</option></select></div></div>
    <button class="btn primary block">Enregistrer</button>
    <button class="btn ghost block">📄 Aperçu public (SCR-090)</button>
  </div>
</div>
</body></html>
