<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Erreur : perte de connexion</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1 style="opacity:.45">Messages</h1></div>
  <div class="content">
    <div class="card" style="text-align:center;gap:10px;border-top:4px solid var(--warning);margin-top:20px">
      <div style="font-size:46px">📡</div>
      <h2 style="font-family:var(--font-display);margin:0;font-size:18px">Connexion instable</h2>
      <p class="small muted">Vos messages ont été mis en file d'attente.<br>Ils seront envoyés dès la connexion rétablie.</p>
      <div class="progressbar" style="margin-top:6px"><div style="width:45%;display:flex;align-items:center;justify-content:flex-end"><span class="small" style="color:#fff;font-size:10px;padding-right:4px">45 %</span></div></div>
    </div>
    <button class="btn primary block" onclick="location.reload()">Réessayer</button>
    <button class="btn ghost block">Continuer hors ligne (lecture seule)</button>
  </div>
</div>
</body></html>
