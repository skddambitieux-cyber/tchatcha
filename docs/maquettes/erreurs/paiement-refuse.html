<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Erreur : paiement refusé</title><link rel="stylesheet" href="../css/tchatcha.css"></head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span class="dots">•••</span></div>
  <div class="topbar"><span class="back">‹</span><h1>Paiement</h1></div>
  <div class="content">
    <div class="card" style="text-align:center;gap:10px;border-top:4px solid var(--error)">
      <div style="font-size:46px">❌</div>
      <h2 style="font-family:var(--font-display);margin:0">Paiement refusé</h2>
      <p class="small muted">Solde MTN MoMo insuffisant ou code erroné.<br>Vérifiez votre solde et réessayez.</p>

    <button class="btn outline block">Changer de moyen de paiement</button>
    <button class="btn ghost block">Signaler un problème</button>
  </div>
</div>
