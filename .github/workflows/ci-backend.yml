# TCHATCHA — CI Backend (NestJS / Nx)
# Référence : 14-cicd.md, 13-strategie-tests.md (testcontainers pour e2e)
name: ci-backend

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tchatcha
          POSTGRES_PASSWORD: tchatcha_ci_password
          POSTGRES_DB: tchatcha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tchatcha -d tchatcha"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tchatcha:tchatcha_ci_password@localhost:5432/tchatcha
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx nx run-many -t lint

      - name: Unit tests
        run: npx nx run-many -t test --coverage

      - name: Build
        run: npx nx run-many -t build

      - name: E2E tests (testcontainers)
        run: npx nx run api-e2e:test