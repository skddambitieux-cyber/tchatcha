# TCHATCHA — CI Backend (NestJS / Nx)
# Lot 6.1 : lint, tests unitaires, build et migrations (TypeORM) sur Postgres éphémère.
name: ci-backend

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tchatcha
          POSTGRES_PASSWORD: tchatcha_ci_password
          POSTGRES_DB: tchatcha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tchatcha -d tchatcha"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tchatcha:tchatcha_ci_password@localhost:5432/tchatcha
      DB_SSL: disabled
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Migrations (TypeORM, base éphémère)
        working-directory: backend
        run: |
          npm run migration:show
          npm run migration:run

      - name: Lint
        working-directory: backend
        run: npx nx lint api

      - name: Unit tests
        working-directory: backend
        run: npx nx test api

      - name: Build
        working-directory: backend
        run: npx nx run api:build