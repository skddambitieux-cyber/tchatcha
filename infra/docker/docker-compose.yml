# TCHATCHA — Stack de développement local (Étape 6, phase 6.1)
# Référence : 17-infrastructure.md, 06-schema-base.md (PostgreSQL 16 + PostGIS)
version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tchatcha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tchatcha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tchatcha_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tchatcha}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tchatcha} -d ${POSTGRES_DB:-tchatcha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tchatcha-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tchatcha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata: